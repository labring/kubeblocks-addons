name: Release KubeBlocks Addon Charts Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, tag, or SHA to build addon charts from"
        required: true
        default: "fix/v0.8.2"
        type: string
      tag:
        description: "The image tag to publish"
        required: true
        type: string
      platforms:
        description: "The target platforms to build"
        required: true
        default: "linux/amd64,linux/arm64"
        type: string

run-name: release kubeblocks addon charts image ${{ inputs.tag }}

permissions:
  contents: read
  packages: write

concurrency:
  group: release-kubeblocks-addon-charts-image-${{ inputs.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-kubeblocks-addon-charts-image:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          BUILD_REF: ${{ inputs.ref }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "${BUILD_REF}" ]]; then
            echo "ref must not be empty"
            exit 1
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "tag must be a valid Docker tag"
            exit 1
          fi

      - name: Checkout addon source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push addon charts image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile-charts
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/kubeblocks-addon-charts:${{ inputs.tag }}

      - name: Print published image
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/kubeblocks-addon-charts:${{ inputs.tag }}"
