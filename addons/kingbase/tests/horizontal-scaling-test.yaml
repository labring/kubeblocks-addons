# Capacity test only. Do not apply until three spare schedulable volumes are
# available; scaling in must be planned separately and never deletes data by accident.
apiVersion: apps.kubeblocks.io/v1alpha1
kind: OpsRequest
metadata:
  name: kingbase-test-hscale-b17
  namespace: kingbase-test
spec:
  clusterRef: kingbase-ha-test
  type: HorizontalScaling
  horizontalScaling:
    - componentName: kingbase
      replicas: 3
