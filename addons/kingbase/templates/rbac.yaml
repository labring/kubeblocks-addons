apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.clusterRoleName }}
  labels:
    app.kubernetes.io/name: {{ .Values.kubeblocks.name }}
    app.kubernetes.io/instance: {{ .Values.kubeblocks.releaseName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/required-by: pod
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - patch
      - update
      - watch
{{- if .Values.cluster.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kingbase.serviceAccountName" . }}
  namespace: {{ .Values.cluster.namespace }}
  labels:
    {{- include "kingbase.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kingbase.serviceAccountName" . }}
  namespace: {{ .Values.cluster.namespace }}
  labels:
    {{- include "kingbase.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeblocks-cluster-pod-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kingbase.serviceAccountName" . }}
    namespace: {{ .Values.cluster.namespace }}
{{- end }}
