image:
  registry: docker.io
  repository: wallykk/kingbase
  tag: v9r1c10-b0004-21
  # The tested wrapper image is pinned for reproducible deployments. When
  # mirroring or rebuilding the image, replace this digest (or set it to ""
  # to select image.tag explicitly).
  digest: sha256:79afd89a27074c693c56fee550cdf3d3532e503a064be78d5f0891fceab4f699
  pullPolicy: IfNotPresent

kubeblocks:
  # These values must match the KubeBlocks controller Helm release so the
  # ClusterRole below is aggregated into kubeblocks-cluster-pod-role.
  name: kubeblocks
  releaseName: kubeblocks
  # KubeBlocks reaches each Pod's lorry endpoint to provision system accounts
  # and advance Component/OpsRequest reconciliation.
  namespace: kb-system

componentDefinition:
  name: kingbase-v9r1c10
  serviceVersion: 9.1.10

clusterDefinition:
  name: kingbase

rbac:
  clusterRoleName: kingbase-kubeblocks-pod-role

license:
  required: true
  secretName: kingbase-license

tls:
  enabled: true
  secretName: kingbase-tls
  sslMode: verify-ca

ha:
  apiTokenSecretName: kingbase-ha-token
  leaseDurationSeconds: 30
  fenceTimeoutSeconds: 15
  retryPeriodSeconds: 2
  switchoverCatchupTimeoutSeconds: 60
  maximumLagOnFailoverBytes: 0
  synchronousCommit: "on"
  synchronousStandbyNames: "ANY 1 (*)"
  automaticFailover: true
  automaticRejoin: true

backup:
  actionSetName: kingbase-basebackup
  policyTemplateName: kingbase-backup-policy-template
  enabled: true
  scheduleEnabled: true
  # Enable only after the target CSI driver has passed a real VolumeSnapshot
  # readiness and restore test. The local LVM driver in the test cluster did
  # not make snapshots ready, so physical basebackup remains the safe default.
  snapshotEnabled: false
  cronExpression: "0 18 * * *"
  retentionPeriod: 7d

configuration:
  enabled: true
  templateName: kingbase-user-configuration
  # Empty means the Helm release namespace, which keeps the definition-only
  # default install self-contained. Production values may place it elsewhere.
  namespace: ""
  logMinDurationStatement: "1000"

monitoring:
  enabled: true
  prometheusRule:
    enabled: false
  namespaceSelector:
    kubernetes.io/metadata.name: monitoring
  replicationLagWarningBytes: 67108864
  replicationLagCriticalBytes: 268435456

cluster:
  create: false
  createNamespace: false
  name: kingbase-prod
  namespace: kingbase-system
  serviceAccountName: kingbase-prod
  replicas: 3
  storageClassName: ""
  storageSize: 500Gi
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  pdb:
    enabled: true
    minAvailable: 2
  networkPolicy:
    enabled: true
    clientNamespaceLabel: kingbase-access
    clientNamespaceLabelValue: "true"
    clientPodLabel: kingbase-client
    clientPodLabelValue: "true"
